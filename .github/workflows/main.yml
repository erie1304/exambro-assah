
name: Build Exambro ASSAH APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name 'settings.gradle' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File project (settings.gradle, build.gradle, folder app) belum diunggah ke tab Code!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS_FILE")
          echo "Mem-build project di folder: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload Exambro ASSAH APK
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-ASSAH-SMK-AlHikmah-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"

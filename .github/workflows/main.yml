name: Build Exambro ASSAH APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          set -e
          SETTINGS_FILE=$(find . -maxdepth 3 -name 'settings.gradle' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS_FILE")
          echo "Mem-build project di: $PROJ_DIR"
          (cd "$PROJ_DIR" && gradle assembleDebug --no-daemon)

          APK_FILE=$(find . -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: File app-debug.apk tidak ditemukan!"
            exit 1
          fi
          cp "$APK_FILE" ./Exambro_SMK_AlHikmah.apk
          ls -lh ./Exambro_SMK_AlHikmah.apk

      - name: Upload Exambro ASSAH APK
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-ASSAH-SMK-AlHikmah-APK
          path: Exambro_SMK_AlHikmah.apk
          if-no-files-found: error
